apis:
  - aid: interpublic:wp-v2-api
    name: Interpublic Group WordPress Wp/v2 API
    description: >-
      WordPress core content API for the Interpublic Group corporate site -
      posts, pages, media, taxonomies, users, settings, blocks and templates.
      Read collections (posts, pages, media, categories, tags, search, types)
      answer anonymously with HTTP 200; users and settings answer HTTP 401
      with the WordPress error envelope. Derived verbatim from the live
      route-discovery document at https://interpublic.com/wp-json/.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://interpublic.com
    tags:
      - Content
      - JSON
      - REST
      - WordPress
      - Newsroom
    properties:
      - type: OpenAPI
        url: openapi/interpublic-wp-v2-api-openapi.yml
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
      - type: APIReference
        url: https://developer.wordpress.org/rest-api/reference/
      - type: DataModel
        url: data-model/interpublic-data-model.yml
      - type: Overlay
        url: overlays/interpublic-wp-rest-overlay.yaml
  - aid: interpublic:wp-abilities-v1-api
    name: Interpublic Group WordPress Abilities API
    description: >-
      WordPress Abilities API - the registry of named abilities an agent may
      discover and run on this install. Present in the route-discovery
      document with six routes; every route observed HTTP 401
      (`rest_forbidden`) anonymously, and a control path on the same host
      answers 404, so the surface exists and is capability-gated.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://interpublic.com
    tags:
      - Abilities
      - Agents
      - WordPress
    properties:
      - type: OpenAPI
        url: openapi/interpublic-wp-abilities-v1-api-openapi.yml
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
  - aid: interpublic:oembed-1-0-api
    name: Interpublic Group oEmbed API
    description: >-
      oEmbed discovery and proxy endpoints exposed by the Interpublic Group
      WordPress install, returning embeddable representations of newsroom
      URLs. Observed HTTP 200 anonymously.
    humanURL: https://oembed.com/
    baseURL: https://interpublic.com
    tags:
      - oEmbed
      - Embed
      - WordPress
    properties:
      - type: OpenAPI
        url: openapi/interpublic-oembed-1-0-api-openapi.yml
  - aid: interpublic:root-api
    name: Interpublic Group WordPress REST Index API
    description: >-
      The REST API index / namespace-discovery route. GET
      https://interpublic.com/wp-json/ returns the self-describing document
      that enumerates all 254 routes across 17 namespaces, along with site
      identity (name "IPG", url https://www.interpublic.com). This document
      is the source every other spec in this repository was derived from.
    humanURL: https://interpublic.com/wp-json/
    baseURL: https://interpublic.com
    tags:
      - Discovery
      - Index
      - WordPress
    properties:
      - type: OpenAPI
        url: openapi/interpublic-root-api-openapi.yml
