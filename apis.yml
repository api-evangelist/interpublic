aid: interpublic
name: Interpublic Group
description: >-
  The Interpublic Group of Companies (IPG) is one of the world's largest
  advertising and marketing services holding companies, with networks
  including McCann Worldgroup, IPG Mediabrands, FCB, MullenLowe Group, and
  Acxiom. In 2024 Omnicom announced its acquisition of IPG; the combined
  brand operations now run under omc.com, and www.interpublic.com
  301-redirects there. IPG publishes no unified public developer portal and
  no product REST API at the holding-company level - technology surfaces are
  delivered through agency-network products such as Acxiom data services and
  Mediabrands' identity and measurement platforms, all partner-gated. The one
  live, machine-readable HTTP contract on IPG's own host is the WordPress
  REST API still served from the apex interpublic.com origin, which carries
  the corporate newsroom (346 posts) and advertises 254 routes across 17
  namespaces through its self-describing route-discovery document.
