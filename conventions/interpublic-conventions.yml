request_id:
  supported: false
  detail: No correlation or request-id header is returned.
versioning:
  scheme: namespace-in-path
  detail: >-
    Version lives in the namespace segment (`/wp-json/wp/v2/`,
    `/wp-json/wp-abilities/v1/`, `/wp-json/oembed/1.0/`). The namespace list
    is discoverable at /wp-json/. No version negotiation header.
error_envelope:
