format: wp-rest-error
rfc9457: false
note: >-
  This API does not use RFC 9457 `application/problem+json`. Every error is
  returned as `application/json` carrying the WordPress error envelope
  {code, message, data:{status}}. Only the codes below were observed live on
  this host; the WordPress core error registry is much larger, and codes are
  not enumerated for operations that could not be exercised anonymously.
  Nothing here is copied from generic WordPress documentation without an
  observed response on this host.
envelope:
  content_type: application/json
  schema: openapi/interpublic-wp-v2-api-openapi.yml#/components/schemas/WPError
  fields:
    - name: code
      type: string
      description: Machine-readable WordPress error slug.
    - name: message
      type: string
      description: Human-readable message. Not stable; do not match on it.
    - name: data.status
      type: integer
      description: HTTP status, repeated inside the body.
